# Lumen Cloud on one AWS server: Lumen (cloud mode) + Caddy (automatic HTTPS).
# Started by /usr/local/bin/lumen-deploy on the server (see lumen-cloud.yaml); values come from
#   /opt/lumen/stack.env   (written by CloudFormation: domain, bucket, GPU address ...)
#   /opt/lumen/secrets.env (written from AWS Secrets Manager: payment keys, company details, session secret)
services:
  lumen:
    build: {context: ../.., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    env_file: [/opt/lumen/stack.env, /opt/lumen/secrets.env]
    environment:
      LUMEN_MODE: cloud
      LUMEN_DEMO: sandbox
      LUMEN_DATA_DIR: /data
      LUMEN_DB: /data/lumen.db
      LUMEN_PUBLIC_URL: https://${LUMEN_DOMAIN}
      LUMEN_SES_REGION: ${AWS_REGION}
      AWS_DEFAULT_REGION: ${AWS_REGION}
    volumes: ["/opt/lumen/data:/data"]
    ports: ["127.0.0.1:8100:8100"]   # only this server (health checks); the internet reaches Lumen through Caddy
    logging: {driver: json-file, options: {max-size: "20m", max-file: "5"}}

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [lumen]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      LUMEN_DOMAIN: ${LUMEN_DOMAIN}
      ACME_EMAIL: ${LUMEN_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/lumen/caddy/data:/data
      - /opt/lumen/caddy/config:/config
    logging: {driver: json-file, options: {max-size: "20m", max-file: "5"}}
