# Lumen live: Lumen + Caddy (automatic HTTPS + password on the web UI).
#   cp .env.example .env   (fill it in)   then:   docker compose up -d --build
services:
  lumen:
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    volumes: [lumen-data:/data]
    expose: ["8100"]            # not published: only Caddy can reach it
    extra_hosts: ["host.docker.internal:host-gateway"]   # for an Ollama running on the server itself

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [lumen]
    ports: ["80:80", "443:443", "443:443/udp"]
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional local LLM for the approval-gated judge / summaries:  docker compose --profile llm up -d
  ollama:
    image: ollama/ollama:0.4.7
    profiles: ["llm"]
    restart: unless-stopped
    expose: ["11434"]
    volumes: [ollama-data:/root/.ollama]

volumes:
  lumen-data:
  caddy-data:
  caddy-config:
  ollama-data:
