<section class="auth">
  <h1>Start free</h1>
  <p class="muted">Free plan, no card needed. Already have an account? <a href="/login">Log in</a>.</p>
  <form class="card" data-api="/auth/signup" data-confirm>
    <div class="msg"></div>
    <div class="field"><label for="nm">Your name</label><input id="nm" name="name" type="text" autocomplete="name" required></div>
    <div class="field"><label for="em">Work email</label><input id="em" name="email" type="email" autocomplete="email" required data-q="email" data-lock="1"></div>
    <div class="field"><label for="og">Company or team name</label><input id="og" name="org" type="text" autocomplete="organization" placeholder="Acme AI"></div>
    <div class="field"><label for="pw">Password (10+ characters)</label><input id="pw" name="password" type="password" autocomplete="new-password" minlength="10" required></div>
    <div class="field"><label for="pw2">Repeat the password</label><input id="pw2" name="password2" type="password" autocomplete="new-password" minlength="10" required></div>
    <input type="hidden" name="plan" data-q="plan"><input type="hidden" name="invite" data-q="invite">
    <div class="field"><label class="check"><input type="checkbox" name="accept" required> <span>I agree to the <a href="/terms" target="_blank">terms of service</a> and the <a href="/privacy" target="_blank">privacy policy</a>.</span></label></div>
    <button class="btn primary" type="submit" style="width:100%">Create my account</button>
  </form>
</section>
